<section
  id="home-hero"
  class="relative isolate flex min-h-[calc(100svh-5rem)] items-center overflow-hidden border-b border-line"
>
  <div
    class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_72%_38%,var(--accent-glow),transparent_48%)]"
    aria-hidden="true"
  ></div>
  <div class="pointer-events-none absolute inset-0 -z-10 opacity-20" aria-hidden="true">
    <svg class="h-full w-full text-accent-bright" viewBox="0 0 1440 900" fill="none">
      <defs>
        <pattern id="home-grid" width="48" height="48" patternUnits="userSpaceOnUse">
          <path d="M48 0H0V48" stroke="currentColor" stroke-opacity=".28" />
        </pattern>
        <linearGradient id="home-wire" x1="190" y1="165" x2="1230" y2="740">
          <stop stop-color="currentColor" stop-opacity=".08" />
          <stop offset=".52" stop-color="currentColor" stop-opacity=".72" />
          <stop offset="1" stop-color="currentColor" stop-opacity=".08" />
        </linearGradient>
      </defs>
      <path fill="url(#home-grid)" d="M0 0h1440v900H0z" />
      <path
        d="M100 725 358 478l166 89 264-287 178 135 349-304"
        stroke="url(#home-wire)"
        stroke-width="1.5"
      />
      <path d="M1036 0 580 900" stroke="currentColor" stroke-opacity=".2" />
      <circle cx="1066" cy="294" r="185" stroke="currentColor" stroke-opacity=".28" />
      <circle cx="1066" cy="294" r="226" stroke="currentColor" stroke-opacity=".13" />
      <circle cx="1066" cy="294" r="267" stroke="currentColor" stroke-opacity=".08" />
    </svg>
  </div>
  <div
    class="pointer-events-none absolute -right-32 top-1/4 -z-10 size-[28rem] rounded-full bg-accent/15 blur-[100px] sm:size-[38rem]"
    aria-hidden="true"
  ></div>

  <div
    class="absolute inset-y-0 right-0 -z-10 w-[42%] lg:w-[35%] overflow-hidden hidden sm:block [clip-path:polygon(0_0,65%_0,100%_100%,0_100%)]"
    [class.bg-surface-2]="theme() === 'light'"
  >
    <img
      class="size-full object-cover object-position-right"
      [class.grayscale-30]="theme() === 'light'"
      [ngSrc]="heroImageSrc"
      alt=""
      width="1920"
      height="1080"
      sizes="(max-width: 768px) 100vw, 40vw"
      priority
    />
    <div
      class="absolute inset-0"
      [class]="theme() === 'light' ? 'bg-bg/50' : 'bg-bg/90'"
    ></div>
    <p class="absolute bottom-2 right-2 text-[10px] text-fg-muted opacity-50">
      Foto: Freepik/Magnific
    </p>
  </div>

  <div class="mx-auto w-full max-w-[1440px] px-5 pb-24 pt-20 sm:px-8 lg:px-16 lg:pb-28 relative z-10">
    <div class="max-w-5xl">
      <p
        class="mb-6 font-display text-xs font-semibold uppercase tracking-[0.16em] text-accent-bright"
      >
        {{ copy.eyebrow | localized }}
      </p>
      @for (key of languageKey(); track key) {
        <h1
          appSplitText
          class="max-w-[12ch] font-display font-semibold leading-[1.02] tracking-tight text-fg text-[clamp(2rem,6vw,4.5rem)]"
        >
          {{ copy.titleBefore | localized }}
          <span class="text-accent-bright">{{ copy.titleHighlight | localized }}</span>
          {{ copy.titleAfter | localized }}
        </h1>
      }
      <p class="mt-7 max-w-[58ch] text-lead leading-relaxed text-fg-muted sm:mt-9">
        {{ copy.description | localized }}
      </p>
      <div class="mt-9 flex flex-col gap-3 sm:flex-row">
        <app-button
          [label]="copy.quoteLabel | localized"
          [href]="whatsappUrl()"
          [external]="true"
          size="lg"
          [showArrow]="true"
        />
        <app-button
          [label]="copy.servicesLabel | localized"
          href="/servicos"
          variant="secondary"
          size="lg"
        />
      </div>
    </div>
  </div>

  <a
    class="absolute bottom-7 left-1/2 inline-flex min-h-11 -translate-x-1/2 items-center gap-3 whitespace-nowrap rounded-full border border-line bg-surface/80 px-4 text-xs font-semibold uppercase tracking-[0.08em] text-fg-muted backdrop-blur transition-colors hover:text-fg focus-visible:outline-offset-4"
    href="#home-about"
    [attr.aria-label]="copy.scrollLabel | localized"
    (click)="scrollToAbout($event)"
  >
    {{ copy.scrollLabel | localized }}
    <app-icon name="arrow" class="rotate-90" />
  </a>
</section>
