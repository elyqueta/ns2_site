<section
  id="home-hero"
  class="relative isolate flex min-h-[calc(100svh-5rem)] items-center overflow-hidden border-b border-line dark:bg-[#0a0e1a]"
>
  <video
    appHeroVideo
    class="absolute inset-0 -z-10 size-full object-cover"
    poster="/images/heros/home-poster.webp"
    muted
    playsinline
    loop
    preload="none"
    aria-hidden="true"
    tabindex="-1"
    width="1280"
    height="720"
  ></video>

  <div class="absolute inset-0 -z-10 bg-[#0a0e1a]/10 dark:bg-[#0a0e1a]/60" aria-hidden="true"></div>
  <div class="absolute inset-0 -z-10 bg-gradient-to-r from-[#0a0e1a]/20 dark:from-[#0a0e1a]/60 via-[#0a0e1a]/10 dark:via-[#0a0e1a]/50 to-[#0a0e1a]/10 dark:to-[#0a0e1a]/30" aria-hidden="true"></div>
  <div
    class="absolute inset-x-0 bottom-0 -z-10 h-[30%] bg-gradient-to-t from-[#0a0e1a] dark:from-[#000000] via-[#0a0e1a]/30 dark:via-[#000000]/50 to-transparent dark:to-transparent"
    aria-hidden="true"
  ></div>

  <div class="mx-auto w-full max-w-[1440px] relative z-10 px-5 pb-24 pt-20 sm:px-8 lg:px-16 lg:pb-28">
    <div class="max-w-5xl">
      <p
        class="mb-6 font-display text-xs font-semibold uppercase tracking-[0.16em] text-accent-bright"
      >
        {{ copy.eyebrow | localized }}
      </p>
      @for (key of languageKey(); track key) {
        <h1
          appSplitText
          class="max-w-[18ch] font-display text-display font-semibold leading-[1.05] tracking-tight text-fg"
        >
          {{ copy.titleBefore | localized }}
          <span class="block text-accent-bright">{{ copy.titleHighlight | localized }}</span>
          {{ copy.titleAfter | localized }}
        </h1>
      }
      <p class="mt-7 max-w-[58ch] text-lead leading-relaxed text-fg sm:mt-9">
        {{ copy.description | localized }}
      </p>
      <div class="mt-9 flex flex-col gap-3 sm:flex-row">
        <app-button
          [label]="heroWebLabel()"
          href="/desenvolvimento-web"
          size="lg"
          [showArrow]="true"
        />
        <app-button
          [label]="heroItLabel()"
          href="/servicos"
          variant="secondary"
          size="lg"
          [extraClasses]="heroItButtonClasses()"
        />
      </div>
      </div>
    </div>
  </section>
