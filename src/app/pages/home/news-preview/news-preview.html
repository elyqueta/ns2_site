<section class="mx-auto max-w-[1440px] px-5 py-[clamp(5rem,10vw,10rem)] sm:px-8 lg:px-16">
  <app-section-heading [index]="copy.index.pt" [title]="copy.title.pt" />
  <div class="mt-10 grid gap-4 lg:grid-cols-3 xl:mt-14">
    @for (article of articles; track article.slug) {
      <article
        class="flex flex-col rounded-card border border-line bg-surface p-6 transition-colors hover:border-accent/50 hover:bg-surface-2 sm:p-8"
      >
        <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
          <p
            class="font-display text-xs font-semibold uppercase tracking-[0.08em] text-accent-bright"
          >
            {{ article.categoria.pt }}
          </p>
          <p class="text-xs text-fg-muted">{{ article.tempoLeitura }} {{ copy.minutesLabel.pt }}</p>
        </div>
        <h3 class="mt-7 font-display text-h3 font-semibold leading-snug text-fg">
          {{ article.titulo.pt }}
        </h3>
        <p class="mt-3 grow text-fg-muted">{{ article.resumo.pt }}</p>
        <a
          class="mt-6 inline-flex min-h-11 items-center gap-2 font-semibold text-accent-bright focus-visible:outline-offset-4"
          [routerLink]="article.href"
        >
          {{ copy.readLabel.pt }}
          <app-icon name="arrow" />
        </a>
      </article>
    }
  </div>
  <a
    class="mt-8 inline-flex min-h-11 items-center gap-2 font-semibold text-accent-bright focus-visible:outline-offset-4"
    routerLink="/noticias"
  >
    {{ copy.linkLabel.pt }}
    <app-icon name="arrow" />
  </a>
</section>
