<section class="mx-auto max-w-[1440px] px-5 py-[clamp(5rem,10vw,10rem)] sm:px-8 lg:px-16">
  <app-section-heading [index]="copy.index | localized" [title]="copy.title | localized" />
  <ol class="mt-10 grid gap-4 sm:grid-cols-2 xl:mt-14 xl:grid-cols-4">
    @for (step of steps; track step.title.pt) {
      <li class="border-t border-line pt-5 sm:pt-7">
        <span class="font-display text-sm font-semibold text-accent-bright">{{
          step.ordemLabel
        }}</span>
        <h3 class="mt-6 font-display text-h3 font-semibold text-fg">
          {{ step.title | localized }}
        </h3>
        <p class="mt-3 text-fg-muted">{{ step.description | localized }}</p>
      </li>
    }
  </ol>
</section>
