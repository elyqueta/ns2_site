<section class="border-y border-line bg-surface">
  <div class="mx-auto max-w-[1440px] px-5 py-[clamp(5rem,10vw,10rem)] sm:px-8 lg:px-16">
    <app-section-heading
      [index]="copy.index.pt"
      [title]="copy.title.pt"
      [description]="copy.description.pt"
    />
    <div class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:mt-14">
      @for (category of categories; track category.slug) {
        <article
          class="group rounded-card border border-line bg-bg p-6 transition-colors hover:border-accent/50 hover:bg-surface-2 sm:p-8"
        >
          <div class="flex items-center justify-between gap-4">
            <span class="font-display text-sm font-semibold text-accent-bright">
              {{ category.ordemLabel }}
            </span>
            <app-icon [name]="category.icone" class="text-accent-bright" />
          </div>
          <h3 class="mt-8 font-display text-h3 font-semibold text-fg">
            {{ category.titulo.pt }}
          </h3>
          <p class="mt-3 text-fg-muted">{{ category.descricao.pt }}</p>
          <a
            class="mt-5 inline-flex min-h-11 items-center gap-2 font-semibold text-accent-bright focus-visible:outline-offset-4"
            [routerLink]="['/produtos']"
            [fragment]="category.slug"
          >
            {{ copy.cardLinkLabel.pt }}
            <app-icon name="arrow" />
          </a>
        </article>
      }
    </div>
    <a
      class="mt-8 inline-flex min-h-11 items-center gap-2 font-semibold text-accent-bright focus-visible:outline-offset-4"
      routerLink="/produtos"
    >
      {{ copy.linkLabel.pt }}
      <app-icon name="arrow" />
    </a>
  </div>
</section>
