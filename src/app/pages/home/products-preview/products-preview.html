<section class="border-y border-line bg-surface">
  <div class="mx-auto max-w-[1440px] px-5 py-[clamp(5rem,10vw,10rem)] sm:px-8 lg:px-16">
    <app-section-heading
      [index]="copy.index | localized"
      [title]="copy.title | localized"
      [description]="copy.description | localized"
    />
    <div class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:mt-14">
      @for (category of categories; track category.slug) {
        <app-product-category-card
          [item]="category"
        />
      }
    </div>
    <a
      class="mt-8 inline-flex min-h-11 items-center gap-2 font-semibold text-accent-bright focus-visible:outline-offset-4"
      routerLink="/produtos"
    >
      {{ copy.linkLabel | localized }}
      <app-icon name="arrow" />
    </a>
  </div>
</section>
