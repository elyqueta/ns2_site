<section class="border-y border-line bg-surface py-14 lg:py-16">
  <div class="mx-auto max-w-[1440px] px-5 sm:px-8 lg:px-16">
    <app-section-heading
      [index]="copy.index | localized"
      [title]="copy.title | localized"
      [description]="copy.description | localized"
    />
    <div appHomeServicesPin class="mt-8 overflow-hidden lg:mt-10">
      <div data-home-services-track class="flex flex-col gap-4 lg:flex-row lg:gap-6">
        @for (service of services; track service.slug) {
          <article
            class="group relative min-w-0 rounded-card border border-line bg-bg p-6 transition-colors hover:border-accent/50 hover:bg-surface-2 lg:w-[min(28rem,42vw)] lg:shrink-0"
          >
            <div class="flex items-start justify-between gap-4">
              <span class="font-display text-sm font-semibold text-accent-bright">
                {{ service.ordemLabel }}
              </span>
              <app-icon [name]="service.icone" class="text-accent-bright" />
            </div>
            <h3 class="mt-6 font-display text-h3 font-semibold text-fg">
              {{ service.titulo | localized }}
            </h3>
            <p class="mt-2 min-h-14 text-fg-muted">{{ service.resumo | localized }}</p>
            <a
              class="mt-4 inline-flex min-h-11 items-center gap-2 whitespace-nowrap font-semibold text-accent-bright focus-visible:outline-offset-4"
              [routerLink]="service.href"
            >
              {{ copy.cardLinkLabel | localized }}
              <app-icon name="arrow" />
            </a>
          </article>
        }
      </div>
      <div
        data-home-services-progress
        class="mt-4 hidden h-px w-full origin-left bg-accent-bright lg:block"
        aria-hidden="true"
      ></div>
    </div>
    <a
      class="mt-8 inline-flex min-h-11 items-center gap-2 font-semibold text-accent-bright focus-visible:outline-offset-4"
      routerLink="/servicos"
    >
      {{ copy.linkLabel | localized }}
      <app-icon name="arrow" />
    </a>
  </div>
</section>
