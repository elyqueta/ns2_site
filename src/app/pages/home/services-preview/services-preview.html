<section class="border-y border-line bg-svc-stage py-14 lg:pt-16 lg:pb-12 overflow-x-clip">
  <div class="mx-auto max-w-[1440px] px-5 sm:px-8 lg:px-16">
    <app-section-heading
      [index]="copy.index | localized"
      [title]="copy.title | localized"
      [description]="copy.description | localized"
    />
    <div appHomeServicesPin class="mt-8 lg:mt-10">
      <div
        class="carousel-viewport relative left-[50%] -mx-[50vw] w-[100vw] snap-x snap-mandatory overflow-x-auto overscroll-x-contain touch-pan-x touch-pan-y lg:overflow-hidden"
        appHomeCarousel
        [appHomeCarouselIndex]="activeIndex()"
        [appHomeCarouselMobileOnly]="true"
        (appHomeCarouselIndexChange)="activeIndex.set($event)"
      >
        <div>
          <div data-home-services-track data-home-carousel-track class="svc-track">
            @for (service of servicosVidro(); track service.titulo.pt; let index = $index) {
              <div
                data-home-carousel-card
                class="snap-center"
                [attr.aria-current]="activeIndex() === index ? 'true' : null"
              >
                <app-servico-vidro-card [item]="service" />
              </div>
            }
          </div>
        </div>
      </div>
      <div class="mt-4 flex justify-center gap-3 lg:hidden">
        <button
          class="inline-flex size-11 items-center justify-center rounded-full border border-line bg-surface text-fg transition-colors hover:border-accent hover:text-accent-bright disabled:cursor-not-allowed disabled:opacity-40"
          type="button"
          [attr.aria-label]="copy.previousLabel | localized"
          [disabled]="activeIndex() === 0"
          (mousedown)="preventPointerFocus($event)"
          (click)="previous($event)"
        >
          <app-icon name="chevron-left" />
        </button>
        <button
          class="inline-flex size-11 items-center justify-center rounded-full border border-line bg-surface text-fg transition-colors hover:border-accent hover:text-accent-bright disabled:cursor-not-allowed disabled:opacity-40"
          type="button"
          [attr.aria-label]="copy.nextLabel | localized"
          [disabled]="activeIndex() === servicosVidro().length - 1"
          (mousedown)="preventPointerFocus($event)"
          (click)="next($event)"
        >
          <app-icon name="chevron-right" />
        </button>
      </div>
      <div
        data-home-services-progress
        class="mt-4 hidden h-px w-full origin-left bg-accent-bright lg:block"
        aria-hidden="true"
      ></div>
    </div>
    <a
      class="mt-8 inline-flex min-h-11 items-center gap-2 font-semibold text-accent-bright focus-visible:outline-offset-4"
      routerLink="/servicos"
    >
      {{ copy.linkLabel | localized }}
      <app-icon name="arrow" />
    </a>
  </div>
</section>
