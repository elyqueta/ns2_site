<section class="border-y border-line bg-surface">
  <div class="mx-auto max-w-[1440px] px-5 py-[clamp(5rem,10vw,10rem)] sm:px-8 lg:px-16">
    <app-section-heading
      [index]="copy.index | localized"
      [title]="copy.title | localized"
      [description]="copy.description | localized"
    />
    <div
      class="carousel-viewport relative left-[50%] mt-10 w-screen -translate-x-1/2 snap-x snap-mandatory overscroll-x-contain touch-pan-x overflow-x-auto px-5 sm:px-8 xl:mt-14 lg:px-16"
      appHomeCarousel
      [appHomeCarouselIndex]="activeIndex()"
      (appHomeCarouselIndexChange)="activeIndex.set($event)"
    >
      <ul
        data-home-carousel-track
        class="flex w-max items-stretch gap-4 py-4 sm:gap-6"
        aria-live="polite"
      >
        @for (item of copy.items; track item.name; let index = $index) {
          <li
            data-home-carousel-card
            class="w-[min(78vw,24rem)] shrink-0 snap-center rounded-card border border-line bg-bg p-6 shadow-lg sm:p-8"
            [attr.aria-current]="activeIndex() === index ? 'true' : null"
          >
            <div class="flex items-start justify-between gap-5">
              <div class="flex items-center gap-4">
                <img class="size-16 rounded-full object-cover" [src]="item.imageSrc" alt="" />
                <div>
                  <h3 class="font-display text-xl font-semibold text-fg">{{ item.name }}</h3>
                  <p class="mt-1 text-sm text-fg-muted">{{ item.role | localized }}</p>
                </div>
              </div>
              <svg class="size-8 shrink-0 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M9 11H5a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h3a2 2 0 0 0 2-2v-5a5 5 0 0 0-5-5M21 11h-4a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h3a2 2 0 0 0 2-2v-5a5 5 0 0 0-5-5" />
              </svg>
            </div>
            <p class="mt-7 leading-relaxed text-fg-muted">“{{ item.quote | localized }}”</p>
          </li>
        }
      </ul>
    </div>
    <div class="mt-5 flex justify-center gap-3">
      <button
        class="inline-flex size-11 items-center justify-center rounded-full border border-line bg-bg text-fg transition-colors hover:border-accent hover:text-accent-bright disabled:cursor-not-allowed disabled:opacity-40"
        type="button"
        [attr.aria-label]="copy.previousLabel | localized"
        [disabled]="activeIndex() === 0"
        (click)="previous($event)"
      >
        <app-icon name="chevron-left" />
      </button>
      <button
        class="inline-flex size-11 items-center justify-center rounded-full border border-line bg-bg text-fg transition-colors hover:border-accent hover:text-accent-bright disabled:cursor-not-allowed disabled:opacity-40"
        type="button"
        [attr.aria-label]="copy.nextLabel | localized"
        [disabled]="activeIndex() === copy.items.length - 1"
        (click)="next($event)"
      >
        <app-icon name="chevron-right" />
      </button>
    </div>
  </div>
</section>
