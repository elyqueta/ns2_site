<section class="border-y border-line bg-surface">
  <div class="mx-auto max-w-[1440px] px-5 py-[clamp(5rem,10vw,10rem)] sm:px-8 lg:px-16">
    <app-section-heading
      [index]="copy.index | localized"
      [title]="copy.title | localized"
      [description]="copy.description | localized"
    />
    <div appMarquee="38" class="relative left-[50%] -mx-[50vw] mt-10 w-[100vw] overflow-hidden xl:mt-14">
      <ul data-marquee-track class="flex w-max gap-4 px-5 sm:gap-5 sm:px-8 lg:gap-6 lg:px-16">
        @for (item of copy.items; track item.name) {
          <li
            class="relative flex h-[28rem] w-[17rem] shrink-0 flex-col justify-end overflow-hidden rounded-card border border-line bg-bg shadow-lg sm:h-[32rem] sm:w-[20rem]"
          >
            <img class="absolute inset-0 size-full object-cover" [src]="item.imageSrc" alt="" aria-hidden="true" />
            <span class="absolute inset-0 bg-gradient-to-t from-bg via-bg/70 to-transparent" aria-hidden="true"></span>
            <span class="relative p-5 sm:p-6">
              <span class="block text-xs font-semibold uppercase tracking-[0.08em] text-accent-bright">
                {{ copy.pendingLabel | localized }}
              </span>
              <span class="mt-3 block font-display text-xl font-semibold text-fg">{{ item.name }}</span>
              <span class="mt-2 block text-sm text-fg-muted">{{ item.role | localized }}</span>
            </span>
          </li>
        }
        @for (item of copy.items; track item.name + '-loop') {
          <li
            class="relative flex h-[28rem] w-[17rem] shrink-0 flex-col justify-end overflow-hidden rounded-card border border-line bg-bg shadow-lg sm:h-[32rem] sm:w-[20rem]"
            aria-hidden="true"
          >
            <img class="absolute inset-0 size-full object-cover" [src]="item.imageSrc" alt="" />
            <span class="absolute inset-0 bg-gradient-to-t from-bg via-bg/70 to-transparent"></span>
            <span class="relative p-5 sm:p-6">
              <span class="block text-xs font-semibold uppercase tracking-[0.08em] text-accent-bright">
                {{ copy.pendingLabel | localized }}
              </span>
              <span class="mt-3 block font-display text-xl font-semibold text-fg">{{ item.name }}</span>
              <span class="mt-2 block text-sm text-fg-muted">{{ item.role | localized }}</span>
            </span>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
