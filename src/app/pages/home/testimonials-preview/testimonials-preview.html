<section class="border-y border-line bg-surface">
  <div class="mx-auto max-w-[1440px] px-5 py-[clamp(5rem,10vw,10rem)] sm:px-8 lg:px-16">
    <app-section-heading
      [index]="copy.index | localized"
      [title]="copy.title | localized"
      [description]="copy.description | localized"
    />
    <ul class="mt-10 grid gap-5 md:grid-cols-2 xl:mt-14 xl:grid-cols-3">
      @for (item of copy.items; track item.name) {
        <li appReveal class="relative overflow-hidden rounded-card border border-line bg-bg p-6 shadow-lg sm:p-8">
          <div class="flex items-start justify-between gap-5">
            <div class="flex items-center gap-4">
              <img class="size-16 rounded-full object-cover" [src]="item.imageSrc" alt="" />
              <div>
                <h3 class="font-display text-xl font-semibold text-fg">{{ item.name }}</h3>
                <p class="mt-1 text-sm text-fg-muted">{{ item.role | localized }}</p>
              </div>
            </div>
            <svg class="size-8 shrink-0 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="M9 11H5a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h3a2 2 0 0 0 2-2v-5a5 5 0 0 0-5-5M21 11h-4a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h3a2 2 0 0 0 2-2v-5a5 5 0 0 0-5-5" />
            </svg>
          </div>
          <p class="mt-7 leading-relaxed text-fg-muted">“{{ item.quote | localized }}”</p>
        </li>
      }
    </ul>
  </div>
</section>
