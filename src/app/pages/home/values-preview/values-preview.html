<section class="border-y border-line bg-surface">
  <div class="mx-auto max-w-[1440px] px-5 py-[clamp(5rem,10vw,10rem)] sm:px-8 lg:px-16">
    <app-section-heading [index]="copy.index.pt" [title]="copy.title.pt" />
    <ul class="mt-10 grid gap-x-8 gap-y-0 sm:grid-cols-2 xl:mt-14 xl:grid-cols-3">
      @for (value of values; track value.title.pt) {
        <li class="border-t border-line py-6 sm:py-8">
          <p
            class="font-display text-xs font-semibold uppercase tracking-[0.08em] text-accent-bright"
          >
            {{ value.ordemLabel }}
          </p>
          <h3 class="mt-4 font-display text-h3 font-semibold text-fg">{{ value.title.pt }}</h3>
          <p class="mt-3 max-w-[44ch] text-fg-muted">{{ value.description.pt }}</p>
        </li>
      }
    </ul>
  </div>
</section>
