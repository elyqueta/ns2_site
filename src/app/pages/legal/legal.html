<app-page-hero
  [title]="legalDocument().title | localized"
  [lead]="legalDocument().lead | localized"
  [breadcrumbs]="breadcrumbs()"
  [current]="legalDocument().title | localized"
  [breadcrumbLabel]="copy.breadcrumbLabel | localized"
/>

<main id="conteudo" class="mx-auto max-w-5xl px-5 py-14 sm:px-8 lg:py-24">
  <p class="rounded-2xl border border-accent/30 bg-accent/10 p-5 text-sm leading-relaxed text-fg">
    {{ legalDocument().reviewNotice | localized }}
  </p>
  <div class="mt-12 space-y-10">
    @for (section of sections(); track section.title.pt) {
      <section [attr.aria-labelledby]="section.id">
        <h2 class="font-display text-h3 font-semibold text-fg" [id]="section.id">
          {{ section.title | localized }}
        </h2>
        <div class="mt-4 max-w-[72ch] space-y-4">
          @for (paragraph of section.paragraphs; track paragraph.pt) {
            <p class="leading-relaxed text-fg-muted">{{ paragraph | localized }}</p>
          }
        </div>
      </section>
    }
  </div>
</main>
