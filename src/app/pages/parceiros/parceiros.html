<app-page-hero
  [title]="copy.title.pt"
  [lead]="copy.lead.pt"
  [breadcrumbs]="breadcrumbs"
  [current]="copy.title.pt"
  [breadcrumbLabel]="copy.breadcrumbLabel.pt"
/>

<main id="conteudo">
  <section class="py-8 sm:py-10" [attr.aria-label]="copy.marqueeLabel.pt">
    <app-marquee [items]="brands" [label]="copy.marqueeLabel.pt" />
  </section>

  <section
    class="mx-auto max-w-[1440px] px-5 py-[clamp(4rem,8vw,8rem)] sm:px-8 lg:px-16"
    [attr.aria-label]="copy.listTitle.pt"
  >
    <app-section-heading [index]="copy.listIndex.pt" [title]="copy.listTitle.pt" />
    <ul class="mt-10 grid gap-4 md:grid-cols-2 xl:mt-14 xl:grid-cols-3">
      @for (partner of partners; track partner.title) {
        <li class="h-full">
          <app-partner-card [item]="partner" />
        </li>
      }
    </ul>
  </section>

  <section class="mx-auto max-w-[1440px] px-5 pb-20 sm:px-8 lg:px-16 lg:pb-28">
    <app-cta-band
      [title]="copy.partnerCtaTitle.pt"
      [description]="copy.partnerCtaDescription.pt"
      [whatsappUrl]="whatsappUrl"
      [whatsappLabel]="copy.contactWhatsappLabel.pt"
      [contactLabel]="copy.contactPageLabel.pt"
    />
  </section>
</main>
