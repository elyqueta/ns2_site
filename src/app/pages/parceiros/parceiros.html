<app-page-hero
  [title]="copy.title | localized"
  [lead]="copy.lead | localized"
  [breadcrumbs]="breadcrumbs()"
  [current]="copy.title | localized"
  [breadcrumbLabel]="copy.breadcrumbLabel | localized"
/>

<main id="conteudo">
  <section class="py-8 sm:py-10" [attr.aria-label]="copy.marqueeLabel | localized">
    <app-marquee [items]="brands" [label]="copy.marqueeLabel | localized" />
  </section>

  <section
    class="mx-auto max-w-[1440px] px-5 py-[clamp(4rem,8vw,8rem)] sm:px-8 lg:px-16"
    [attr.aria-label]="copy.listTitle | localized"
  >
    <app-section-heading
      [index]="copy.listIndex | localized"
      [title]="copy.listTitle | localized"
    />
    <ul class="mt-10 grid gap-4 md:grid-cols-2 xl:mt-14 xl:grid-cols-3">
      @for (partner of partners(); track partner.title) {
        <li class="h-full">
          <app-partner-card [item]="partner" />
        </li>
      }
    </ul>
  </section>

  <section class="mx-auto max-w-[1440px] px-5 pb-20 sm:px-8 lg:px-16 lg:pb-28">
    <app-cta-band
      [title]="copy.partnerCtaTitle | localized"
      [description]="copy.partnerCtaDescription | localized"
      [whatsappUrl]="whatsappUrl()"
      [whatsappLabel]="copy.contactWhatsappLabel | localized"
      [contactLabel]="copy.contactPageLabel | localized"
    />
  </section>
</main>
