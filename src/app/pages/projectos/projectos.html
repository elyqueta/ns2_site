<app-page-hero
  [title]="copy.title | localized"
  [lead]="copy.lead | localized"
  [breadcrumbs]="breadcrumbs()"
  [current]="copy.title | localized"
  [breadcrumbLabel]="copy.breadcrumbLabel | localized"
  [imageSrc]="'/images/heros/projectos.webp'"
  [imagePosition]="'center'"
  [imageAlt]="'Dois colegas a rever o design de um site num monitor'"
  [imageSizes]="'100vw'"
  [imageSrcset]="'/images/heros/projectos-640.webp 640w, /images/heros/projectos-1024.webp 1024w, /images/heros/projectos.webp 1600w'"
/>

<main id="conteudo">
  <section class="mx-auto max-w-360 px-5 py-16 sm:px-8 lg:px-16">
    <div class="grid grid-cols-1 gap-5 sm:gap-6 lg:grid-cols-2">
      @for (project of projectCards(); track project.slug) {
        <app-project-preview-card
          [project]="project"
          [linkLabel]="copy.verProjetoLabel | localized"
          [transitionKey]="project.slug"
          [gridLayout]="true"
        />
      }
    </div>
  </section>

  <section class="mx-auto max-w-360 px-5 pb-20 sm:px-8 lg:px-16 lg:pb-28">
    <app-cta-band
      [title]="copy.ctaTitle | localized"
      [description]="copy.ctaDescription | localized"
      [whatsappUrl]="whatsappUrl()"
      [whatsappLabel]="copy.whatsappLabel | localized"
      [contactLabel]="copy.contactLabel | localized"
    />
  </section>
</main>
