<app-page-hero
  [title]="copy.title | localized"
  [lead]="copy.lead | localized"
  [breadcrumbs]="breadcrumbs()"
  [current]="copy.title | localized"
  [breadcrumbLabel]="copy.breadcrumbLabel | localized"
/>

<main id="conteudo">
  <section
    class="mx-auto max-w-[1440px] px-5 py-[clamp(5rem,10vw,10rem)] sm:px-8 lg:px-16"
    [attr.aria-label]="copy.listTitle | localized"
  >
    <app-section-heading
      [index]="copy.sectionIndex | localized"
      [title]="copy.listTitle | localized"
    />
    <ol class="mt-10 grid gap-4 md:grid-cols-2 xl:mt-14 xl:grid-cols-3">
      @for (service of services; track service.slug) {
        <li
          class="group flex min-h-full flex-col rounded-card border border-line bg-surface p-6 transition-colors hover:border-accent/50 hover:bg-surface-2 sm:p-8"
        >
          <app-media-slot
            [alt]="service.imagem.alt | localized"
            [expectedFile]="service.imagem.ficheiroEsperado | localized"
            [src]="service.imagemSrc"
            class="mb-6"
            [width]="300"
            [height]="200"
          />
          <div class="flex items-center justify-between gap-3">
            <app-icon [name]="service.icone" class="text-accent-bright" />
          </div>
          <h3 class="mt-6 font-display text-h3 font-semibold text-fg">
            {{ service.titulo | localized }}
          </h3>
          <p class="mt-3 flex-1 text-fg-muted">{{ service.resumo | localized }}</p>
          <a
            class="mt-5 inline-flex min-h-11 items-center gap-2 whitespace-nowrap font-semibold text-accent-bright focus-visible:outline-offset-4"
            [routerLink]="service.href"
          >
            {{ copy.detailLink | localized }}
            <span class="sr-only">{{ service.titulo | localized }}</span>
            <app-icon name="arrow" />
          </a>
        </li>
      }
    </ol>
  </section>
  <section class="mx-auto max-w-[1440px] px-5 pb-20 sm:px-8 lg:px-16 lg:pb-28">
    <app-cta-band
      [title]="copy.generalCtaTitle | localized"
      [description]="copy.lead | localized"
      [whatsappUrl]="whatsappUrl()"
      [whatsappLabel]="copy.whatsappLabel | localized"
      [contactLabel]="copy.contactLabel | localized"
    />
  </section>
</main>
