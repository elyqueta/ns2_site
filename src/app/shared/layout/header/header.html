<header
  appHeaderMotion
  [class.dark]="headerDark()"
  class="fixed inset-x-0 top-0 z-40 border-b border-transparent bg-transparent transition-[background-color,border-color,backdrop-filter] duration-300"
>
  <div class="mx-auto flex h-20 max-w-[1440px] items-center justify-between px-5 sm:px-8 lg:px-16">
    <a
      class="inline-flex min-h-11 shrink-0 items-center"
      routerLink="/"
      [attr.aria-label]="logoLabel()"
    >
      <img
        class="h-9 w-auto dark:hidden"
        src="/brand/logo-mark.svg"
        alt="NS2 Innovation"
        width="1487"
        height="689"
      />
      <img
        class="hidden h-9 w-auto dark:block"
        src="/brand/logo-mark-dark.svg"
        alt="NS2 Innovation"
        width="1487"
        height="689"
      />
    </a>

    <nav class="hidden items-center gap-8 lg:flex" [attr.aria-label]="navigationLabel()">
      @for (item of navigation(); track item.id ?? item.href) {
        @if (item.kind === 'link') {
          <a
            class="min-h-11 whitespace-nowrap content-center text-lg font-medium text-fg-muted transition-colors hover:text-fg"
            [routerLink]="item.href"
            routerLinkActive="text-accent-bright"
            [routerLinkActiveOptions]="{ exact: item.href === '/' }"
            ariaCurrentWhenActive="page"
          >
            {{ item.label }}
          </a>
        }
        @if (item.kind === 'group') {
          <app-nav-dropdown
            [label]="item.label"
            [items]="item.children"
            [id]="item.id"
          />
        }
      }
    </nav>

    <div class="flex items-center gap-2 sm:gap-3">
      <app-language-toggle class="hidden lg:flex" />
      <app-theme-toggle class="hidden lg:flex" />
      <button
        #menuTrigger
        class="inline-flex size-11 items-center justify-center rounded-full border border-line bg-surface text-fg lg:hidden cursor-pointer"
        type="button"
        [attr.aria-label]="menuLabel()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-navigation"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <app-icon name="close" />
        } @else {
          <app-icon name="menu" />
        }
      </button>
    </div>
  </div>
</header>
<app-mobile-menu
  [open]="menuOpen()"
  [items]="navigation()"
  (close)="closeMenu()"
  (closed)="focusMenuTrigger()"
/>
