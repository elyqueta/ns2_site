@if (visible()) {
  <div
    appPreloaderMotion
    class="fixed inset-0 z-[70] flex items-center justify-center bg-bg [clip-path:polygon(0_0,100%_0,100%_88%,0_100%)]"
    role="status"
    [attr.aria-label]="label()"
    (finished)="finish()"
  >
    <img class="h-20 w-20 dark:hidden" src="/brand/logo-mark.svg" alt="" width="655" height="689" />
    <img
      class="hidden h-20 w-20 dark:block"
      src="/brand/logo-mark-dark.svg"
      alt=""
      width="655"
      height="689"
    />
  </div>
}
