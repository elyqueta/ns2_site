<div class="divide-y divide-line rounded-2xl border border-line bg-surface">
  @for (item of items(); track item.id) {
    <section class="px-5 sm:px-6">
      <h3>
        <button
          class="flex min-h-14 w-full items-center justify-between gap-4 py-4 text-left font-semibold text-fg cursor-pointer"
          type="button"
          [attr.aria-expanded]="openItem() === item.id"
          [attr.aria-controls]="item.id"
          (click)="toggle(item.id)"
        >
          {{ item.question }}
          @if (openItem() === item.id) {
            <app-icon name="close" />
          } @else {
            <app-icon name="plus" />
          }
        </button>
      </h3>
      <div
        class="overflow-hidden transition-[grid-template-rows] duration-300 ease-out"
        [class.grid]="true"
        [class.grid-rows-[0fr]]="openItem() !== item.id"
        [class.grid-rows-[1fr]]="openItem() === item.id"
        [appAccordionHeight]="openItem() === item.id"
        [id]="item.id"
        [attr.aria-hidden]="openItem() !== item.id"
        [attr.inert]="openItem() !== item.id ? '' : null"
      >
        <div class="min-h-0 pb-5 pr-8 text-fg-muted">
          <p>{{ item.answer }}</p>
        </div>
      </div>
    </section>
  }
</div>
