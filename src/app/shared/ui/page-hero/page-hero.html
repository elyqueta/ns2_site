<header class="relative isolate overflow-hidden border-b border-line bg-surface">
  @if (imageSrc(); as src) {
      <img
        class="absolute inset-0 -z-10 size-full object-cover"
        [ngSrc]="src"
        [alt]="imageAlt()"
        width="1920"
        height="1080"
        loading="eager"
        fetchpriority="high"
        [sizes]="imageSizes()"
        [srcset]="imageSrcset()"
        [style.object-position]="imagePosition()"
        [style.object-fit]="imageFit()"
        [class]="imageClass()"
        [attr.aria-hidden]="imageAlt() ? null : true"
      />
    <div
      class="absolute inset-0 -z-10 bg-bg/60 dark:bg-bg/40"
      aria-hidden="true"
    ></div>
  }
  <div
    class="pointer-events-none absolute inset-y-0 right-0 -z-10 w-2/3 bg-gradient-to-l from-accent/15 to-transparent [clip-path:polygon(35%_0,100%_0,100%_100%,0_100%)]"
  ></div>
  <div class="mx-auto max-w-[1440px] px-5 py-16 sm:px-8 sm:py-24 lg:px-16 lg:py-32">
    @if (breadcrumbs().length > 0) {
      <app-breadcrumb [items]="breadcrumbs()" [current]="current()" [label]="breadcrumbLabel()" />
    }
    @switch (headingLevel()) {
      @case ('h1') {
        <h1
          class="mt-10 max-w-5xl font-display text-page font-semibold leading-[1.08] tracking-tight text-fg"
        >
          {{ title() }}
        </h1>
      }
      @case ('h2') {
        <h2
          class="mt-10 max-w-5xl font-display text-page font-semibold leading-[1.08] tracking-tight text-fg"
        >
          {{ title() }}
        </h2>
      }
      @case ('h3') {
        <h3
          class="mt-10 max-w-[62ch] font-display text-page font-semibold leading-[1.08] tracking-tight text-fg"
        >
          {{ title() }}
        </h3>
      }
    }
    <p class="mt-6 max-w-[62ch] text-lead leading-relaxed text-fg-muted">{{ lead() }}</p>
  </div>
</header>
