<article
  class="product-highlight-card group h-full"
  [class.product-highlight-card--force-hover]="forceHover()"
>
  <div class="product-highlight-card__media">
    @if (item().imageSrc && !imageFailed()) {
      <img
        class="product-highlight-card__image"
        [src]="item().imageSrc"
        [alt]="item().imageAlt | localized"
        (error)="onImageError()"
      />
    } @else {
      <span class="product-highlight-card__fallback" aria-hidden="true"></span>
    }
    <span class="product-highlight-card__overlay" aria-hidden="true"></span>
    <span class="product-highlight-card__favorite" aria-hidden="true">
      <app-icon name="heart" />
    </span>
  </div>
  <div class="product-highlight-card__content">
    <p class="product-highlight-card__label">{{ item().label | localized }}</p>
    <h4 class="product-highlight-card__title line-clamp-2 min-h-[1.2em]">{{ item().title | localized }}</h4>
    <p class="product-highlight-card__description line-clamp-2">{{ item().description | localized }}</p>
    <a
      class="product-highlight-card__action"
      [href]="item().whatsappUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>{{ item().actionLabel | localized }}</span>
      <span class="product-highlight-card__arrow" aria-hidden="true">
        <app-icon name="arrow" />
      </span>
    </a>
  </div>
</article>
