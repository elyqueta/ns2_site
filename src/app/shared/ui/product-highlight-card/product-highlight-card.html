<article
  class="group flex min-h-56 flex-col rounded-card border border-line bg-surface p-6 transition-[transform,border-color,background-color,box-shadow] duration-300 hover:-translate-y-1 hover:border-accent/50 hover:bg-surface-2 hover:shadow-lg focus-within:-translate-y-1 focus-within:border-accent/50 focus-within:bg-surface-2 focus-within:shadow-lg sm:p-7"
>
  <p class="font-display text-xs font-semibold uppercase tracking-[0.08em] text-accent-bright">
    {{ item().label | localized }}
  </p>
  <h4 class="mt-4 font-display text-h3 font-semibold leading-snug text-fg">
    {{ item().title | localized }}
  </h4>
  <p class="mt-3 flex-1 text-fg-muted">{{ item().description | localized }}</p>
  <a
    class="mt-5 inline-flex min-h-11 items-center gap-2 self-start font-semibold text-accent-bright focus-visible:outline-offset-4"
    [href]="item().whatsappUrl"
    target="_blank"
    rel="noopener noreferrer"
  >
    <app-icon name="whatsapp" />
    {{ item().actionLabel | localized }}
  </a>
</article>
